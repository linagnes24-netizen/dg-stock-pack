name: 每日更新收盤價資料包

on:
  schedule:
    - cron: '7 22 * * *'    # 台北時間 06:07
    - cron: '37 23 * * *'   # 台北時間 07:37（補跑）
    - cron: '17 1 * * *'    # 台北時間 09:17（補跑）
    - cron: '47 3 * * *'    # 台北時間 11:47（補跑）
  workflow_dispatch:         # 可在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 抓取收盤價並產生資料包
        run: node update-pack.mjs
      - name: 有變化才提交
        run: |
          git config user.name "dg-pack-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || (git commit -m "收盤價資料包 $(TZ=Asia/Taipei date +%F)" && git push)
